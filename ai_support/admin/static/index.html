<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xonsaroy Pay · Админ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f3f6);
    --text: var(--tg-theme-text-color, #1b1f24);
    --hint: var(--tg-theme-hint-color, #7a828c);
    --link: var(--tg-theme-link-color, #2a7ae2);
    --accent: var(--tg-theme-button-color, #2a7ae2);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--hint) 25%, transparent);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg2); color: var(--text);
         font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
  nav { display: flex; overflow-x: auto; }
  nav button { flex: 1 0 auto; padding: 12px 8px; border: 0; background: none; color: var(--hint); font: inherit;
               font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav button.on { color: var(--accent); border-bottom-color: var(--accent); }
  main { padding: 12px 16px 40px; max-width: 760px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .card { background: var(--bg); border-radius: 12px; padding: 12px; }
  .card b { display: block; font-size: 22px; }
  .card span, .muted { color: var(--hint); font-size: 13px; }
  .list { background: var(--bg); border-radius: 12px; overflow: hidden; margin-top: 10px; }
  .row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line);
         cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--hint); flex: none; }
  .dot.open { background: #2e9d5a; }
  .dot.wait { background: #e0902a; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--bg2); color: var(--hint); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  select, input, .btn { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
                        background: var(--bg); color: var(--text); }
  input { width: 100%; }
  .btn { background: var(--accent); color: var(--accent-text); border: 0; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: var(--bg2); color: var(--text); }
  .btn.danger { color: #d33f3f; }
  .btn.danger.sure { background: #d33f3f; color: #fff; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .row .acts { flex: none; max-width: 46%; }
  .row .acts .btn { padding: 6px 10px; font-size: 13px; }
  form.edit { display: grid; gap: 8px; padding: 10px 12px 12px; border-bottom: 1px solid var(--line); background: var(--bg2); }
  form.edit[hidden] { display: none; }
  form.add { display: grid; gap: 8px; background: var(--bg); padding: 12px; border-radius: 12px; margin-top: 10px; }
  h2 { font-size: 17px; margin: 16px 0 6px; }
  /* Statistics: one accent hue for every bar, values in text colors. */
  .panel { background: var(--bg); border-radius: 12px; padding: 12px; margin-top: 10px; }
  .panel h3 { margin: 0 0 10px; font-size: 15px; }
  .panel .sub { color: var(--hint); font-size: 12px; font-weight: 400; margin-left: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .kpi b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--hint); font-size: 12px; }
  .cols { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding-top: 16px; position: relative; }
  .cols .c { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; height: 100%;
             cursor: default; position: relative; }
  .cols .c i { display: block; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
  .cols .c.zero i { background: var(--line); }
  .cols .c:hover i, .cols .c:focus i { filter: brightness(1.15); }
  .cols .c .tip { display: none; position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%);
                  background: var(--text); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 8px;
                  white-space: nowrap; z-index: 2; pointer-events: none; }
  .cols .c:hover .tip, .cols .c:focus .tip { display: block; }
  .cols .c:first-child .tip { left: 0; transform: none; }
  .cols .c:last-child .tip { left: auto; right: 0; transform: none; }
  .axis { display: flex; justify-content: space-between; color: var(--hint); font-size: 11px; margin-top: 4px;
          border-top: 1px solid var(--line); padding-top: 4px; }
  .hbars { display: grid; gap: 6px; }
  .hbar { display: grid; grid-template-columns: minmax(70px, 34%) 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
  .hbar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .track { height: 10px; background: var(--bg2); border-radius: 5px; overflow: hidden; }
  .hbar .track i { display: block; height: 100%; background: var(--accent); border-radius: 5px; min-width: 2px; }
  .hbar .val { color: var(--hint); font-variant-numeric: tabular-nums; min-width: 22px; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--bg2); border-radius: 10px; padding: 4px 10px; font-size: 13px; }
  .chip b { font-variant-numeric: tabular-nums; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .two > .panel { margin-top: 0; }
  .profile { display: flex; gap: 12px; align-items: center; }
  .profile .grow { min-width: 0; }
  .profile b { font-size: 17px; }
  /* The session chat looks like a Telegram chat: wallpaper, bubbles with tails, date and service pills. */
  .tgchat { --wall: #b9d1a1; --wall2: #dfe8b8; --in: #ffffff; --out: #e1fec6; --meta: #8a9aa6; --meta-out: #5fa65a;
            --name: #3a8fd8; --ink: #000000; --service: rgba(40, 60, 40, .42); --doodle: rgba(70, 110, 60, .10); }
  :root[data-scheme="dark"] .tgchat { --wall: #0f1a24; --wall2: #17222d; --in: #182533; --out: #2b5278;
            --meta: #6d8193; --meta-out: #7da8d3; --name: #71b8f5; --ink: #f5f7fa; --service: rgba(0, 0, 0, .38); --doodle: rgba(255, 255, 255, .03); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-scheme="light"]) .tgchat { --wall: #0f1a24; --wall2: #17222d; --in: #182533; --out: #2b5278;
            --meta: #6d8193; --meta-out: #7da8d3; --name: #71b8f5; --ink: #f5f7fa; --service: rgba(0, 0, 0, .38); --doodle: rgba(255, 255, 255, .03); }
  }
  body.in-chat header { display: none; }
  body.in-chat main { max-width: none; padding: 0; }
  .tgchat { min-height: 100vh; display: flex; flex-direction: column;
            background: radial-gradient(circle at 20% 20%, var(--doodle) 0 2px, transparent 3px) 0 0 / 28px 28px,
                        radial-gradient(circle at 70% 60%, var(--doodle) 0 1.5px, transparent 2.5px) 0 0 / 36px 36px,
                        linear-gradient(160deg, var(--wall2), var(--wall)); }
  .tgbar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 8px 12px;
           background: var(--bg); border-bottom: 1px solid var(--line); }
  .tgbar .back { font-size: 26px; line-height: 1; padding: 0 6px 2px 0; }
  .tgbar .who { flex: 1; min-width: 0; cursor: pointer; }
  .tgbar .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tgbar .who span { display: block; color: var(--hint); font-size: 13px; overflow: hidden; text-overflow: ellipsis;
                     white-space: nowrap; }
  .tgbar .who span.live { color: var(--accent); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
            color: #fff; font-weight: 600; font-size: 16px; }
  .tgmsgs { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 10px 8px 24px;
            max-width: 760px; width: 100%; margin: 0 auto; }
  .day, .service { align-self: center; margin: 8px 0; padding: 3px 10px; border-radius: 12px; color: #fff;
                   background: var(--service); font-size: 13px; font-weight: 500; text-align: center; max-width: 85%; }
  .service { font-weight: 400; }
  .bubble { position: relative; max-width: min(78%, 420px); padding: 6px 9px 6px 10px; border-radius: 15px;
            background: var(--in); color: var(--ink); box-shadow: 0 1px 1px rgba(0, 0, 0, .13);
            white-space: pre-wrap; overflow-wrap: anywhere; align-self: flex-start; }
  .bubble.out { align-self: flex-end; background: var(--out); }
  .bubble.last { margin-bottom: 6px; }
  .bubble.last.in { border-bottom-left-radius: 4px; }
  .bubble.last.out { border-bottom-right-radius: 4px; }
  .bubble.last.in::before, .bubble.last.out::before { content: ""; position: absolute; bottom: 0; width: 10px; height: 14px;
            background: inherit; }
  .bubble.last.in::before { left: -7px; clip-path: path("M10 0 L10 14 L0 14 C5 12 9 8 10 0 Z"); }
  .bubble.last.out::before { right: -7px; clip-path: path("M0 0 L0 14 L10 14 C5 12 1 8 0 0 Z"); }
  .bubble .name { font-size: 13px; font-weight: 600; color: var(--name); margin-bottom: 1px; }
  .bubble .time { float: right; margin: 6px 0 -4px 10px; font-size: 11.5px; color: var(--meta); white-space: nowrap; }
  .bubble.out .time { color: var(--meta-out); }
  .bubble .kind { font-style: italic; color: var(--meta); }
  .bubble.media { padding: 3px; }
  .bubble.media .name { padding: 3px 7px 2px; }
  .bubble.media .caption { padding: 4px 7px 3px; }
  .bubble.media .time.over { position: absolute; right: 9px; bottom: 9px; margin: 0; padding: 1px 6px;
            border-radius: 9px; background: rgba(0, 0, 0, .45); color: #fff; }
  .photos { display: grid; gap: 2px; border-radius: 12px; overflow: hidden; }
  .photos.n2, .photos.n4 { grid-template-columns: 1fr 1fr; }
  .photos.n3 { grid-template-columns: 1fr 1fr; } .photos.n3 > :first-child { grid-column: span 2; }
  .ph { position: relative; min-width: 180px; min-height: 120px; background: color-mix(in srgb, var(--meta) 22%, transparent);
        display: grid; place-items: center; color: var(--meta); font-size: 13px; }
  .photos:not(.n1) { width: min(300px, 68vw); }
  .photos:not(.n1) .ph { min-width: 0; }
  .photos:not(.n1) .ph img { height: 190px; }
  .ph img { display: block; width: 100%; max-height: 360px; object-fit: cover; cursor: zoom-in; }
  .ph.loading::after { content: ""; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--meta);
        border-top-color: transparent; animation: spin 0.9s linear infinite; }
  .ph audio { width: 240px; max-width: 100%; }
  .ph.file { min-height: 0; min-width: 0; padding: 8px; }
  .ph.file a { color: var(--name); }
  .bubble.audio .ph { background: none; min-height: 0; padding: 4px 4px 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ph.loading::after { animation: none; } }
  .dock { position: sticky; bottom: 0; z-index: 3; background: var(--bg); border-top: 1px solid var(--line);
          padding-bottom: env(safe-area-inset-bottom, 0px); }
  .composer { display: flex; gap: 8px; align-items: flex-end; padding: 8px 10px 4px; max-width: 760px; margin: 0 auto; }
  .composer textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: var(--bg2); color: var(--text);
              font: inherit; padding: 9px 12px; border-radius: 18px; max-height: 160px; }
  .composer .send { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent);
              color: var(--accent-text); font-size: 18px; cursor: pointer; }
  .composer.busy .send { opacity: .5; }
  .composer-note { color: var(--hint); font-size: 12px; padding: 0 14px 8px; max-width: 760px; margin: 0 auto; }
  .viewer { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .92); display: grid; place-items: center;
            cursor: zoom-out; }
  .viewer img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
  .back { color: var(--link); background: none; border: 0; font: inherit; padding: 4px 0; cursor: pointer; }
  .head { background: var(--bg); border-radius: 12px; padding: 12px; margin-top: 6px; }
  .empty { text-align: center; color: var(--hint); padding: 30px 10px; }
  /* Quick questions and their guides. */
  .cat-add { display: block; width: 100%; text-align: left; padding: 10px 12px; border: 0; background: none;
             color: var(--link); font: inherit; cursor: pointer; }
  .pill.ok { background: color-mix(in srgb, #2e9d5a 16%, transparent); color: #2e9d5a; }
  .pill.off { background: color-mix(in srgb, #e0902a 18%, transparent); color: #b8731d; }
  .seg { display: flex; gap: 4px; background: var(--bg2); border-radius: 10px; padding: 3px; margin-bottom: 10px; overflow-x: auto; }
  .seg button { flex: 1; border: 0; background: none; color: var(--hint); font: inherit; font-size: 13px; font-weight: 600;
                padding: 6px 8px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
  .seg button .has { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #2e9d5a;
                     margin-left: 5px; vertical-align: middle; }
  .field { display: grid; gap: 4px; margin-bottom: 10px; }
  .field > span { font-size: 13px; color: var(--hint); }
  textarea.big { width: 100%; min-height: 110px; resize: vertical; font: inherit; padding: 8px 10px; border-radius: 10px;
                 border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .step { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: center; margin-bottom: 6px; }
  .step b { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-text);
            display: grid; place-items: center; font-size: 13px; }
  .icon { border: 0; background: var(--bg2); color: var(--text); width: 34px; height: 34px; border-radius: 9px;
          font: inherit; font-size: 16px; cursor: pointer; }
  .icon:disabled { opacity: .35; cursor: default; }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .shot { background: var(--bg2); border-radius: 10px; overflow: hidden; display: grid; }
  .shot .ph { min-width: 0; min-height: 0; aspect-ratio: 9 / 16; }
  .shot .ph img { height: 100%; max-height: none; }
  .shot .acts { justify-content: space-between; padding: 4px; gap: 4px; flex-wrap: nowrap; }
  .shot .icon { width: 30px; height: 28px; font-size: 14px; background: var(--bg); }
  .upload { display: grid; place-items: center; text-align: center; border: 1.5px dashed var(--line); border-radius: 10px;
            color: var(--link); cursor: pointer; min-height: 140px; padding: 8px; font-size: 13px; }
  .upload input { display: none; }
  .upload.disabled { color: var(--hint); cursor: default; }
  .errors { background: color-mix(in srgb, #d33f3f 10%, var(--bg)); border: 1px solid color-mix(in srgb, #d33f3f 40%, transparent);
            color: var(--text); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
  .errors b { color: #d33f3f; }
  .errors ul { margin: 6px 0 0; padding-left: 18px; }
  .check { display: flex; gap: 8px; align-items: center; margin: 4px 0 10px; }
  .check input { width: auto; }
  .savebar { position: sticky; bottom: 0; display: flex; gap: 8px; justify-content: space-between; padding: 10px 0;
             background: linear-gradient(transparent, var(--bg2) 30%); }
  .preview.tgchat { min-height: 0; border-radius: 12px; overflow: hidden; }
  .preview .tgmsgs { padding: 10px 10px 14px; }
  .preview .kb { align-self: flex-start; display: flex; gap: 2px; width: min(78%, 420px); margin-top: 2px; }
  .preview .kb span { flex: 1; text-align: center; font-size: 13px; color: #fff; background: var(--service);
                      border-radius: 8px; padding: 5px 4px; }
</style>
</head>
<body>
<header><nav id="tabs">
  <button data-tab="overview">Обзор</button>
  <button data-tab="sessions">Сессии</button>
  <button data-tab="operators">Операторы</button>
  <button data-tab="clients">Клиенты</button>
  <button data-tab="quick">Вопросы</button>
</nav></header>
<main id="view"><div class="empty">Загрузка…</div></main>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); document.documentElement.dataset.scheme = tg.colorScheme;
  tg.onEvent && tg.onEvent("themeChanged", () => { document.documentElement.dataset.scheme = tg.colorScheme; }); }
const initData = tg ? tg.initData : "";
const view = document.getElementById("view");
let timer = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = iso => { if (!iso) return ""; const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}); };
const LANG = {uz_latn: "uz", uz_cyrl: "уз", ru: "ru", en: "en"};
const WHO = {client: "Клиент", bot: "🤖 Бот", operator: "👨‍💼 Оператор"};
const KIND = {photo: "📷 Фото", voice: "🎤 Голос", audio: "🎵 Аудио", document: "📎 Файл"};

const notify = msg => (tg && tg.showAlert ? tg.showAlert(msg) : alert(msg));

async function api(path, options = {}) {
  const res = await fetch(path, {...options, headers: {"Content-Type": "application/json",
    "X-Telegram-Init-Data": initData, ...(options.headers || {})}});
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || res.status), {status: res.status, body});
  return body;
}

function fail(e) {
  if (e.status === 401) view.innerHTML = '<div class="empty">Откройте панель через админ-бота в Telegram.</div>';
  else if (e.status === 403) view.innerHTML = `<div class="empty">Нет доступа. Добавьте ваш id <b>${esc(e.body.user_id)}</b> в ADMIN_IDS.</div>`;
  else view.innerHTML = `<div class="empty">Ошибка: ${esc(e.message)}</div>`;
}

function route() {
  clearInterval(timer);
  document.body.classList.remove("in-chat");
  const [name, arg] = (location.hash.slice(1) || "overview").split("=");
  const tab = {session: "sessions", client: "clients", guide: "quick"}[name] || name;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const pages = {overview, sessions, session, operators, clients, client, quick, guide};
  window.scrollTo(0, 0);
  (pages[name] || overview)(arg).catch(fail);
}
document.getElementById("tabs").onclick = e => { if (e.target.dataset.tab) location.hash = e.target.dataset.tab; };
window.addEventListener("hashchange", route);

async function overview() {
  const o = await api("/api/overview");
  const score = s => s.count ? `${s.average}★` : "—";
  const card = (v, label) => `<div class="card"><b>${esc(v)}</b><span>${label}</span></div>`;
  view.innerHTML = `<div class="cards">
    ${card(o.clients, `клиентов · +${o.clients_today} сегодня`)}
    ${card(o.sessions_open, "открытых сессий")}
    ${card(o.waiting_operator, "ждут оператора")}
    ${card(o.handoffs_today, "передано операторам сегодня")}
    ${card(o.sessions_today, "сессий сегодня")}
    ${card(o.messages_today, "сообщений сегодня")}
    ${card(score(o.rating_bot), `рейтинг бота · ${o.rating_bot.count} оценок`)}
    ${card(score(o.rating_operators), `рейтинг операторов · ${o.rating_operators.count}`)}
    ${card(o.operators_active, "активных операторов")}
  </div>
  <h2>Ждут оператора</h2><div id="waiting" class="list"></div><div id="stats"></div>`;
  const open = (await api("/api/sessions?status=open&limit=50")).filter(s => s.escalated && !s.operator_id);
  document.getElementById("waiting").innerHTML = open.length ? open.map(sessionRow).join("")
    : '<div class="empty">Никто не ждёт</div>';
  document.getElementById("stats").innerHTML = await statsSection();
  timer = setInterval(() => overview().catch(fail), 15000);
}

const TONE = {polite: "вежливо", calm: "спокойно", rude: "грубо"};
const LEVEL = {A: "A · вежливые", B: "B · обычные", C: "C · требуют внимания"};
const SENDER = {client: "от клиента", bot: "от бота", operator: "от операторов", system: "событий"};
const shortDay = d => new Date(d + "T00:00:00").toLocaleDateString("ru-RU", {day: "numeric", month: "short"});

function kpis(items) {
  return `<div class="kpis">${items.map(([v, label]) => `<div class="kpi"><b>${esc(v)}</b><span>${label}</span></div>`).join("")}</div>`;
}

function hbars(rows, empty = "Нет данных") {
  const max = Math.max(1, ...rows.map(r => r.count));
  return rows.length ? `<div class="hbars">${rows.map(r => `<div class="hbar"><span class="lbl" title="${esc(r.name)}">${esc(r.name)}</span>
    <span class="track"><i style="width:${(100 * r.count / max).toFixed(1)}%"></i></span><span class="val">${r.count}</span></div>`).join("")}</div>`
    : `<div class="muted">${empty}</div>`;
}

function stars(score) {
  const rows = ["5", "4", "3", "2", "1"].map(k => ({name: "★".repeat(+k), count: score.by_stars[k] || 0}));
  const extra = [score.no_answer ? `без ответа: ${score.no_answer}` : "", score.not_helped ? `не помогли: ${score.not_helped}` : ""]
    .filter(Boolean).join(" · ");
  return `${hbars(rows)}<div class="muted" style="margin-top:6px">${score.count ? `средняя ${score.average}★ · ${score.count} оценок` : "оценок пока нет"}${extra ? " · " + extra : ""}</div>`;
}

function chips(obj, labels = {}) {
  const items = Object.entries(obj).filter(([, n]) => n);
  return items.length ? `<div class="chips">${items.map(([k, n]) => `<span class="chip">${esc(labels[k] || k)} <b>${n}</b></span>`).join("")}</div>`
    : '<div class="muted">Нет данных</div>';
}

function daily(rows) {
  const max = Math.max(1, ...rows.map(r => r.sessions));
  const total = rows.reduce((a, r) => a + r.sessions, 0);
  return `<div class="cols" role="img" aria-label="Сессии по дням, всего ${total}">${rows.map(r =>
    `<div class="c${r.sessions ? "" : " zero"}" tabindex="0"><i style="height:${(100 * r.sessions / max).toFixed(1)}%"></i>
      <span class="tip">${shortDay(r.day)}: сессий ${r.sessions}, передано ${r.handoffs}, новых клиентов ${r.clients}</span></div>`).join("")}</div>
    <div class="axis"><span>${shortDay(rows[0].day)}</span><span>макс. ${max} в день</span><span>${shortDay(rows.at(-1).day)}</span></div>`;
}

const AVATAR = ["#e17076", "#7bc862", "#e5ca77", "#65aadd", "#a695e7", "#ee7aae", "#6ec9cb", "#faa774"];
const initials = name => String(name || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const day = iso => { const d = new Date(iso); return isNaN(d) ? "" :
  d.toLocaleDateString("ru-RU", {day: "numeric", month: "long", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric"}); };
const clock = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"}); };
const media = new Map();  // /api/media/... -> Promise of a blob URL, so a refresh does not download again

function loadMedia(url) {
  if (!media.has(url)) media.set(url, fetch(url, {headers: {"X-Telegram-Init-Data": initData}})
    .then(r => r.ok ? r.blob() : Promise.reject(r.status)).then(b => ({url: URL.createObjectURL(b), type: b.type})));
  return media.get(url);
}

function fillMedia(root) {
  root.querySelectorAll(".ph[data-src]").forEach(el => {
    const src = el.dataset.src; el.removeAttribute("data-src");
    loadMedia(src).then(({url, type}) => {
      el.classList.remove("loading");
      if (type.startsWith("image/")) {
        const img = new Image(); img.src = url; img.alt = "Фото клиента";
        img.onclick = () => { const v = document.createElement("div"); v.className = "viewer";
          v.innerHTML = `<img src="${url}" alt="">`; v.onclick = () => v.remove(); document.body.append(v); };
        el.append(img);
      } else if (type.startsWith("audio/") || type.startsWith("video/ogg")) {
        el.innerHTML = `<audio controls preload="metadata" src="${url}"></audio>`;
      } else {
        el.classList.add("file"); el.innerHTML = `<a href="${url}" target="_blank" rel="noopener">📎 Открыть файл</a>`;
      }
    }, () => { el.classList.remove("loading"); el.textContent = el.dataset.fail || "Файл недоступен"; });
  });
}

function bubble(m, prev, next) {
  if (m.sender === "system" || m.sender === "event") return `<div class="service">${esc(m.text)}</div>`;
  const out = m.sender !== "client";
  const author = m.sender === "operator" ? "👨‍💼 " + (m.operator_name || "Оператор") : m.sender === "bot" ? "🤖 Бот" : "";
  const same = (a, b) => a && b && a.sender === b.sender && a.operator_name === b.operator_name
    && day(a.created_at) === day(b.created_at);
  const first = !same(prev, m), last = !same(m, next);
  const time = `<span class="time">${clock(m.created_at)}</span>`;
  const name = out && first ? `<div class="name">${esc(author)}</div>` : "";
  const cls = `bubble ${out ? "out" : "in"}${last ? " last" : ""}`;
  const placeholder = /^\[.*\]$/.test(m.text || "");  // "[фото]" saved instead of a caption
  const caption = placeholder ? "" : esc(m.text);
  if (m.files && m.id) {
    const audio = m.kind === "voice" || m.kind === "audio";
    const fail = audio ? "🎤 Голосовое недоступно" : "📷 Фото недоступно";
    const items = Array.from({length: m.files}, (_, i) =>
      `<div class="ph loading" data-src="/api/media/${m.id}/${i}" data-fail="${fail}"></div>`).join("");
    return `<div class="${cls} media${audio ? " audio" : ""}">${name}<div class="photos n${Math.min(m.files, 4)}">${items}</div>${
      caption ? `<div class="caption">${caption}${time}</div>` : time.replace('class="time"', 'class="time over"')}</div>`;
  }
  const kind = m.kind !== "text" ? `<span class="kind">${KIND[m.kind] || m.kind}</span>${caption ? "\n" : ""}` : "";
  return `<div class="${cls}">${name}${kind}${caption}${time}</div>`;
}

async function session(id) {
  document.body.classList.add("in-chat");
  let shown = "";
  view.innerHTML = `<div class="tgchat"><div class="tgbar" id="bar"></div><div class="tgmsgs" id="msgs"></div>
    <div class="dock"><form class="composer" id="composer">
      <textarea id="reply" rows="1" maxlength="4000" placeholder="Ответить клиенту…" aria-label="Ответ клиенту"></textarea>
      <button class="send" aria-label="Отправить" title="Отправить">➤</button>
    </form>
    <div class="composer-note" id="note"></div></div></div>`;
  const render = async () => {
    const s = await api(`/api/sessions/${encodeURIComponent(id)}`);
    const sig = s.status + s.messages.length + ":" + (s.messages.at(-1) || {}).id;
    if (sig === shown) return s;  // nothing new: keep loaded photos, the draft and the scroll position
    const firstRender = !shown;
    shown = sig;
    const rows = [];
    s.messages.forEach((m, i) => {
      if (day(m.created_at) !== day((s.messages[i - 1] || {}).created_at)) rows.push(`<div class="day">${day(m.created_at)}</div>`);
      rows.push(bubble(m, s.messages[i - 1], s.messages[i + 1]));
    });
    const who = sessionWho(s);
    const live = s.status === "open";
    const stillAtBottom = innerHeight + scrollY >= document.body.scrollHeight - 80;
    document.getElementById("bar").innerHTML = `<button class="back" onclick="history.back()" aria-label="Назад">‹</button>
        <div class="avatar" style="background:${AVATAR[Math.abs(parseInt(s.client_id, 10) || 0) % AVATAR.length]}">${esc(initials(s.client_name))}</div>
        <div class="who" onclick="location.hash='client=${esc(s.client_id)}'" title="Все сессии клиента">
          <b>${esc(s.client_name)}</b>
          <span class="${live ? "live" : ""}">${live ? "открыта" : "завершена"} · ${esc(who)} · ${esc(s.topic || "без темы")} · ${esc(LANG[s.language] || s.language || "")}${s.rating ? ` · ${s.rating.stars}★` : ""}</span>
          <span>${[s.client_username ? "@" + s.client_username : "", s.client_phone || "", "сессия #" + s.id].filter(Boolean).map(esc).join(" · ")}</span>
        </div>`;
    const msgs = document.getElementById("msgs");
    msgs.innerHTML = rows.join("") || '<div class="service">Сообщений нет</div>';
    fillMedia(msgs);
    document.getElementById("note").textContent = live
      ? "Клиент получит ответ от имени «Специалист поддержки», копия уйдёт в чат поддержки."
      : "Сессия завершена: ответ откроет клиенту новый разговор.";
    if (firstRender || stillAtBottom) scrollTo(0, document.body.scrollHeight);
    return s;
  };
  const box = document.getElementById("reply"), form = document.getElementById("composer");
  const grow = () => { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 160) + "px"; };
  box.oninput = grow;
  box.onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) form.requestSubmit(); };
  form.onsubmit = async e => {
    e.preventDefault();
    const text = box.value.trim();
    if (!text || form.classList.contains("busy")) return;
    form.classList.add("busy");
    try {
      const res = await api(`/api/sessions/${encodeURIComponent(id)}/reply`, {method: "POST", body: JSON.stringify({text})});
      box.value = ""; grow();
      if (String(res.session_id) !== String(id)) { location.hash = "session=" + res.session_id; return; }
      await render();
      scrollTo(0, document.body.scrollHeight);
    } catch (err) {
      notify(err.status === 502 ? "Не удалось отправить: клиент заблокировал бота или нет токена клиентского бота."
        : "Не удалось отправить: " + err.message);
    } finally { form.classList.remove("busy"); }
  };
  await render();
  timer = setInterval(() => render().catch(fail), 5000);
}

const SIGN = {uz_latn: "Yordamchi", uz_cyrl: "Ёрдамчи", ru: "Помощник", en: "Assistant"};
const ASKED = {uz_latn: "Savolingiz:", uz_cyrl: "Саволингиз:", ru: "Ваш вопрос:", en: "Your question:"};
const KB = {uz_latn: ["Suhbatni yakunlash", "Menyu"], uz_cyrl: ["Суҳбатни якунлаш", "Меню"],
            ru: ["Завершить разговор", "Меню"], en: ["End conversation", "Menu"]};
const FORBIDDEN = {promised_refund: "обещание возврата денег", promised_timeline: "обещание срока",
  confirmed_success: "подтверждение успешной операции", unblocked: "обещание разблокировки",
  changed_limit_or_data: "изменение лимита, данных или отмена платежа", antifraud_criteria: "правила антифрода",
  financial_advice: "финансовый совет"};
const GUIDE_ERR = {no_label: "Напишите текст кнопки хотя бы на одном языке",
  no_answer: "Напишите ответ или шаги хотя бы на одном языке", too_many_steps: "Не больше 15 шагов",
  too_long_texts: "Текст слишком длинный (до 3500 знаков)", too_long_labels: "Текст кнопки слишком длинный (до 120 знаков)",
  bad_image: "Нужен скриншот в PNG или JPEG", image_too_large: "Фото больше 5 МБ", too_many_images: "Не больше 10 фото",
  empty_image: "Пустой файл", not_found: "Вопрос не найден"};
const where = w => { const [field, lang, n] = w.split(".");
  return `${{labels: "кнопка", texts: "ответ", steps: "шаг " + n}[field]}, ${(LANGS.find(l => l[0] === lang) || [, lang])[1]}`; };

async function quick() {
  const {categories} = await api("/api/quick");
  view.innerHTML = `<p class="muted">Кнопки клиентского бота по темам. Если у вопроса есть инструкция на языке клиента,
      бот сразу отправляет её: текст, шаги и скриншоты. Без инструкции отвечает AI по базе знаний.
      Перед сохранением текст проверяется: бот не обещает возврат и сроки, не подтверждает платежи и не раскрывает антифрод.</p>
    ${categories.map(c => `<h2>${esc(c.label.ru)}</h2><div class="list">${c.questions.map(q => `
      <div class="row" onclick="location.hash='guide=${esc(q.id)}'">
        <div class="grow"><div class="title">${esc(q.label.ru || Object.values(q.label)[0] || q.id)}</div>
          <div class="muted">${q.guide_languages.length
            ? `<span class="pill ok">инструкция: ${q.guide_languages.map(l => LANG[l]).join(", ")}</span>`
            : '<span class="pill">отвечает AI</span>'}
            ${q.images ? `<span class="pill">фото ${q.images}</span>` : ""}
            ${q.custom ? '<span class="pill">добавлен</span>' : ""}
            ${q.hidden ? '<span class="pill off">скрыт</span>' : ""}
            ${q.updated_at ? " · изменено " + esc(when(q.updated_at)) + (q.updated_by ? ", " + esc(q.updated_by) : "") : ""}</div></div>
        <span class="muted">›</span></div>`).join("")}
      <button class="cat-add" onclick="location.hash='guide=new.${esc(c.id)}'">+ Добавить вопрос</button></div>`).join("")}`;
}

async function guide(arg) {
  const isNew = arg.startsWith("new.");
  const g = isNew
    ? {id: null, category: arg.slice(4), custom: true, default_label: {}, labels: {}, texts: {}, steps: {}, hidden: false, images: []}
    : await api(`/api/quick/${encodeURIComponent(arg)}`);
  const cats = isNew || !guide.cats ? (await api("/api/quick")).categories : guide.cats;
  guide.cats = cats;
  const cat = cats.find(c => c.id === g.category) || {label: {ru: g.category}};
  const ed = {labels: {...g.labels}, texts: {...g.texts}, steps: Object.fromEntries(Object.entries(g.steps).map(([k, v]) => [k, [...v]]))};
  let lang = guide.lang || "ru";
  const filled = l => Boolean((ed.texts[l] || "").trim() || (ed.steps[l] || []).some(s => s.trim()));
  view.innerHTML = `<button class="back" onclick="history.back()">‹ Назад</button>
    <div class="panel"><div class="muted">${esc(cat.label.ru)} · ${g.custom ? "вопрос добавлен в панели" : "встроенный вопрос"}</div>
      <b id="gtitle" style="font-size:17px"></b></div>
    <div class="panel"><div class="seg" id="seg"></div>
      <label class="field"><span>Текст кнопки${g.custom ? "" : " (пусто — как в боте по умолчанию)"}</span>
        <input id="glabel" maxlength="120"></label>
      <label class="field"><span>Ответ: что случилось и почему</span>
        <textarea id="gtext" class="big" maxlength="3500" placeholder="Например: карта добавляется в разделе «Карты». Нужна карта на ваше имя."></textarea></label>
      <div class="field"><span>Как решить: шаги по порядку</span><div id="steps"></div>
        <button type="button" class="btn ghost" id="addstep" style="justify-self:start">+ Шаг</button></div>
    </div>
    <div class="panel"><h3>Скриншоты <span class="sub">общие для всех языков, до 10, PNG или JPEG до 5 МБ</span></h3>
      <div class="shots" id="shots"></div></div>
    <div class="panel"><h3>Как увидит клиент <span class="sub" id="plang"></span></h3>
      <div class="preview tgchat"><div class="tgmsgs" id="preview"></div></div></div>
    <label class="check"><input type="checkbox" id="ghidden"> Скрыть вопрос из меню бота</label>
    <div id="gerr"></div>
    <div class="savebar"><button class="btn" id="gsave">Сохранить</button>
      ${isNew ? "" : `<button class="btn ghost danger" id="gdel">${g.custom ? "Удалить вопрос" : "Удалить инструкцию"}</button>`}</div>`;
  const $ = id => document.getElementById(id);
  $("ghidden").checked = g.hidden;

  const stepRow = (s, i, n) => `<div class="step"><b>${i + 1}</b>
    <input data-step="${i}" value="${esc(s)}" placeholder="Шаг ${i + 1}" maxlength="500">
    <div class="acts" style="flex-wrap:nowrap"><button type="button" class="icon" data-up="${i}" ${i ? "" : "disabled"} aria-label="Выше">↑</button>
      <button type="button" class="icon" data-rm="${i}" aria-label="Удалить шаг">×</button></div></div>`;
  const drawSteps = () => {
    const steps = ed.steps[lang] || [];
    $("steps").innerHTML = steps.map((s, i) => stepRow(s, i, steps.length)).join("") || '<div class="muted" style="margin-bottom:6px">Шагов пока нет</div>';
    $("steps").querySelectorAll("input[data-step]").forEach(inp => inp.oninput = () => { ed.steps[lang][+inp.dataset.step] = inp.value; draw(false); });
    $("steps").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { ed.steps[lang].splice(+b.dataset.rm, 1); drawSteps(); draw(false); });
    $("steps").querySelectorAll("[data-up]").forEach(b => b.onclick = () => { const i = +b.dataset.up, st = ed.steps[lang];
      [st[i - 1], st[i]] = [st[i], st[i - 1]]; drawSteps(); draw(false); });
  };
  const label = l => (ed.labels[l] || "").trim() || g.default_label[l] || "";
  const draw = (fields = true) => {
    $("seg").innerHTML = LANGS.map(([code, name]) => `<button type="button" data-lang="${code}" class="${code === lang ? "on" : ""}">${name}${filled(code) ? '<span class="has"></span>' : ""}</button>`).join("");
    $("seg").querySelectorAll("button").forEach(b => b.onclick = () => { lang = guide.lang = b.dataset.lang; drawSteps(); draw(); });
    if (fields) {
      $("glabel").value = ed.labels[lang] || ""; $("glabel").placeholder = g.default_label[lang] || "Вопрос, как его задал бы клиент";
      $("gtext").value = ed.texts[lang] || "";
    }
    $("gtitle").textContent = label("ru") || label(lang) || "Новый вопрос";
    const steps = (ed.steps[lang] || []).filter(s => s.trim());
    const body = [(ed.texts[lang] || "").trim(), steps.length ? STEPS_HEAD[lang] + "\n" + steps.map((s, i) => `${i + 1}. ${s.trim()}`).join("\n") : ""].filter(Boolean).join("\n\n");
    $("plang").textContent = (LANGS.find(l => l[0] === lang) || [])[1] || "";
    const n = g.images.length;
    $("preview").innerHTML = `<div class="bubble in last">${esc(ASKED[lang])} ${esc(label(lang) || "…")}</div>` + (body
      ? `<div class="bubble in last"><div class="name">${esc(SIGN[lang])}</div>${esc(body)}</div>
         <div class="kb">${KB[lang].map(k => `<span>${esc(k)}</span>`).join("")}</div>
         ${n ? `<div class="bubble in media last"><div class="photos n${Math.min(n, 4)}">${g.images.slice(0, 4).map(i =>
            `<div class="ph loading" data-src="/api/quick/${encodeURIComponent(g.id)}/images/${i.id}"></div>`).join("")}</div></div>` : ""}`
      : `<div class="service">${g.custom ? "Без ответа вопрос не сохранится" : "Нет инструкции на этом языке: ответит AI по базе знаний"}</div>`);
    fillMedia($("preview"));
  };
  const drawShots = () => {
    const canUpload = Boolean(g.id) && g.images.length < 10;
    $("shots").innerHTML = g.images.map((i, k) => `<div class="shot">
        <div class="ph loading" data-src="/api/quick/${encodeURIComponent(g.id)}/images/${i.id}"></div>
        <div class="acts"><button class="icon" data-move="${i.id}" data-d="-1" ${k ? "" : "disabled"} aria-label="Раньше">←</button>
          <button class="icon" data-move="${i.id}" data-d="1" ${k < g.images.length - 1 ? "" : "disabled"} aria-label="Позже">→</button>
          <button class="icon" data-delimg="${i.id}" aria-label="Удалить фото">×</button></div></div>`).join("")
      + (g.images.length < 10 ? `<label class="upload ${canUpload ? "" : "disabled"}">${canUpload
          ? '+ Добавить скриншот<input type="file" accept="image/png,image/jpeg" multiple>'
          : "Сначала сохраните вопрос, потом добавьте скриншоты"}</label>` : "");
    fillMedia($("shots"));
    $("shots").querySelectorAll("[data-move]").forEach(b => b.onclick = async () => {
      Object.assign(g, await api(`/api/quick/${encodeURIComponent(g.id)}/images/${b.dataset.move}/move`, {method: "POST", body: JSON.stringify({delta: +b.dataset.d})}));
      drawShots(); draw(false);
    });
    $("shots").querySelectorAll("[data-delimg]").forEach(b => b.onclick = async () => {
      Object.assign(g, await api(`/api/quick/${encodeURIComponent(g.id)}/images/${b.dataset.delimg}`, {method: "DELETE"}));
      drawShots(); draw(false);
    });
    const file = $("shots").querySelector("input[type=file]");
    if (file) file.onchange = async () => {
      for (const f of file.files) {
        const form = new FormData(); form.append("file", f);
        const res = await fetch(`/api/quick/${encodeURIComponent(g.id)}/images`, {method: "POST", body: form, headers: {"X-Telegram-Init-Data": initData}});
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { notify(`${f.name}: ${GUIDE_ERR[body.error] || body.error || res.status}`); break; }
        Object.assign(g, body);
      }
      drawShots(); draw(false);
    };
  };
  $("glabel").oninput = () => { ed.labels[lang] = $("glabel").value; draw(false); };
  $("gtext").oninput = () => { ed.texts[lang] = $("gtext").value; draw(false); };
  $("addstep").onclick = () => { (ed.steps[lang] = ed.steps[lang] || []).push(""); drawSteps();
    const all = $("steps").querySelectorAll("input[data-step]"); all[all.length - 1].focus(); };
  $("gsave").onclick = async () => {
    const body = {category: g.category, hidden: $("ghidden").checked, labels: ed.labels, texts: ed.texts,
                  steps: Object.fromEntries(Object.entries(ed.steps).map(([k, v]) => [k, v.filter(s => s.trim())]))};
    $("gerr").innerHTML = "";
    try {
      const saved = await api(isNew ? "/api/quick" : `/api/quick/${encodeURIComponent(g.id)}`, {method: isNew ? "POST" : "PUT", body: JSON.stringify(body)});
      if (isNew) { history.replaceState(null, "", "#guide=" + saved.id); return route(); }
      Object.assign(g, saved); notify("Сохранено");
    } catch (err) {
      if (err.message === "forbidden") {
        $("gerr").innerHTML = `<div class="errors"><b>Не сохранено: так боту отвечать нельзя</b><ul>${err.body.violations.map(v =>
          `<li>«${esc(v.fragment)}» — ${esc(FORBIDDEN[v.category] || v.category)} (${esc(where(v.where))})</li>`).join("")}</ul>
          <div class="muted" style="margin-top:6px">Перепишите без обещаний: например, «специалист проверит операцию и сообщит результат».</div></div>`;
        $("gerr").scrollIntoView({behavior: "smooth", block: "center"});
      } else notify(GUIDE_ERR[err.message] || "Не сохранено: " + err.message);
    }
  };
  const del = $("gdel");
  if (del) del.onclick = async () => {
    if (!del.classList.contains("sure")) {
      const text = del.textContent; del.classList.add("sure"); del.textContent = "Точно удалить?";
      setTimeout(() => { del.classList.remove("sure"); del.textContent = text; }, 4000);
      return;
    }
    await api(`/api/quick/${encodeURIComponent(g.id)}`, {method: "DELETE"}).catch(err => notify("Не удалено: " + err.message));
    location.hash = "quick";
  };
  drawSteps(); draw(); drawShots();
}

if (tg && tg.BackButton) {
  tg.BackButton.onClick(() => history.back());
  window.addEventListener("hashchange", () => /^#(session|client|guide)=/.test(location.hash)
    ? tg.BackButton.show() : tg.BackButton.hide());
}
route();
</script>
</body>
</html>
