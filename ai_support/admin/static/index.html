<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xonsaroy Pay · Админ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f1f3f6);
    --text: var(--tg-theme-text-color, #1b1f24);
    --hint: var(--tg-theme-hint-color, #7a828c);
    --link: var(--tg-theme-link-color, #2a7ae2);
    --accent: var(--tg-theme-button-color, #2a7ae2);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--hint) 25%, transparent);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg2); color: var(--text);
         font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
  nav { display: flex; overflow-x: auto; }
  nav button { flex: 1; padding: 12px 10px; border: 0; background: none; color: var(--hint); font: inherit;
               font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav button.on { color: var(--accent); border-bottom-color: var(--accent); }
  main { padding: 12px 16px 40px; max-width: 760px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .card { background: var(--bg); border-radius: 12px; padding: 12px; }
  .card b { display: block; font-size: 22px; }
  .card span, .muted { color: var(--hint); font-size: 13px; }
  .list { background: var(--bg); border-radius: 12px; overflow: hidden; margin-top: 10px; }
  .row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line);
         cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--hint); flex: none; }
  .dot.open { background: #2e9d5a; }
  .dot.wait { background: #e0902a; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--bg2); color: var(--hint); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  select, input, .btn { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
                        background: var(--bg); color: var(--text); }
  input { width: 100%; }
  .btn { background: var(--accent); color: var(--accent-text); border: 0; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: var(--bg2); color: var(--text); }
  form.add { display: grid; gap: 8px; background: var(--bg); padding: 12px; border-radius: 12px; margin-top: 10px; }
  h2 { font-size: 17px; margin: 16px 0 6px; }
  /* The session chat looks like a Telegram chat: wallpaper, bubbles with tails, date and service pills. */
  .tgchat { --wall: #b9d1a1; --wall2: #dfe8b8; --in: #ffffff; --out: #e1fec6; --meta: #8a9aa6; --meta-out: #5fa65a;
            --name: #3a8fd8; --ink: #000000; --service: rgba(40, 60, 40, .42); --doodle: rgba(70, 110, 60, .10); }
  :root[data-scheme="dark"] .tgchat { --wall: #0f1a24; --wall2: #17222d; --in: #182533; --out: #2b5278;
            --meta: #6d8193; --meta-out: #7da8d3; --name: #71b8f5; --ink: #f5f7fa; --service: rgba(0, 0, 0, .38); --doodle: rgba(255, 255, 255, .03); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-scheme="light"]) .tgchat { --wall: #0f1a24; --wall2: #17222d; --in: #182533; --out: #2b5278;
            --meta: #6d8193; --meta-out: #7da8d3; --name: #71b8f5; --ink: #f5f7fa; --service: rgba(0, 0, 0, .38); --doodle: rgba(255, 255, 255, .03); }
  }
  body.in-chat header { display: none; }
  body.in-chat main { max-width: none; padding: 0; }
  .tgchat { min-height: 100vh; display: flex; flex-direction: column;
            background: radial-gradient(circle at 20% 20%, var(--doodle) 0 2px, transparent 3px) 0 0 / 28px 28px,
                        radial-gradient(circle at 70% 60%, var(--doodle) 0 1.5px, transparent 2.5px) 0 0 / 36px 36px,
                        linear-gradient(160deg, var(--wall2), var(--wall)); }
  .tgbar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 8px 12px;
           background: var(--bg); border-bottom: 1px solid var(--line); }
  .tgbar .back { font-size: 26px; line-height: 1; padding: 0 6px 2px 0; }
  .tgbar .who { flex: 1; min-width: 0; cursor: pointer; }
  .tgbar .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tgbar .who span { display: block; color: var(--hint); font-size: 13px; overflow: hidden; text-overflow: ellipsis;
                     white-space: nowrap; }
  .tgbar .who span.live { color: var(--accent); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
            color: #fff; font-weight: 600; font-size: 16px; }
  .tgmsgs { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 10px 8px 24px;
            max-width: 760px; width: 100%; margin: 0 auto; }
  .day, .service { align-self: center; margin: 8px 0; padding: 3px 10px; border-radius: 12px; color: #fff;
                   background: var(--service); font-size: 13px; font-weight: 500; text-align: center; max-width: 85%; }
  .service { font-weight: 400; }
  .bubble { position: relative; max-width: min(78%, 420px); padding: 6px 9px 6px 10px; border-radius: 15px;
            background: var(--in); color: var(--ink); box-shadow: 0 1px 1px rgba(0, 0, 0, .13);
            white-space: pre-wrap; overflow-wrap: anywhere; align-self: flex-start; }
  .bubble.out { align-self: flex-end; background: var(--out); }
  .bubble.last { margin-bottom: 6px; }
  .bubble.last.in { border-bottom-left-radius: 4px; }
  .bubble.last.out { border-bottom-right-radius: 4px; }
  .bubble.last.in::before, .bubble.last.out::before { content: ""; position: absolute; bottom: 0; width: 10px; height: 14px;
            background: inherit; }
  .bubble.last.in::before { left: -7px; clip-path: path("M10 0 L10 14 L0 14 C5 12 9 8 10 0 Z"); }
  .bubble.last.out::before { right: -7px; clip-path: path("M0 0 L0 14 L10 14 C5 12 1 8 0 0 Z"); }
  .bubble .name { font-size: 13px; font-weight: 600; color: var(--name); margin-bottom: 1px; }
  .bubble .time { float: right; margin: 6px 0 -4px 10px; font-size: 11.5px; color: var(--meta); white-space: nowrap; }
  .bubble.out .time { color: var(--meta-out); }
  .bubble .kind { font-style: italic; color: var(--meta); }
  .bubble.media { padding: 3px; }
  .bubble.media .name { padding: 3px 7px 2px; }
  .bubble.media .caption { padding: 4px 7px 3px; }
  .bubble.media .time.over { position: absolute; right: 9px; bottom: 9px; margin: 0; padding: 1px 6px;
            border-radius: 9px; background: rgba(0, 0, 0, .45); color: #fff; }
  .photos { display: grid; gap: 2px; border-radius: 12px; overflow: hidden; }
  .photos.n2, .photos.n4 { grid-template-columns: 1fr 1fr; }
  .photos.n3 { grid-template-columns: 1fr 1fr; } .photos.n3 > :first-child { grid-column: span 2; }
  .ph { position: relative; min-width: 180px; min-height: 120px; background: color-mix(in srgb, var(--meta) 22%, transparent);
        display: grid; place-items: center; color: var(--meta); font-size: 13px; }
  .photos:not(.n1) { width: min(300px, 68vw); }
  .photos:not(.n1) .ph { min-width: 0; }
  .photos:not(.n1) .ph img { height: 190px; }
  .ph img { display: block; width: 100%; max-height: 360px; object-fit: cover; cursor: zoom-in; }
  .ph.loading::after { content: ""; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--meta);
        border-top-color: transparent; animation: spin 0.9s linear infinite; }
  .ph audio { width: 240px; max-width: 100%; }
  .ph.file { min-height: 0; min-width: 0; padding: 8px; }
  .ph.file a { color: var(--name); }
  .bubble.audio .ph { background: none; min-height: 0; padding: 4px 4px 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ph.loading::after { animation: none; } }
  .viewer { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .92); display: grid; place-items: center;
            cursor: zoom-out; }
  .viewer img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
  .back { color: var(--link); background: none; border: 0; font: inherit; padding: 4px 0; cursor: pointer; }
  .head { background: var(--bg); border-radius: 12px; padding: 12px; margin-top: 6px; }
  .empty { text-align: center; color: var(--hint); padding: 30px 10px; }
</style>
</head>
<body>
<header><nav id="tabs">
  <button data-tab="overview">Обзор</button>
  <button data-tab="sessions">Сессии</button>
  <button data-tab="operators">Операторы</button>
  <button data-tab="clients">Клиенты</button>
</nav></header>
<main id="view"><div class="empty">Загрузка…</div></main>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); document.documentElement.dataset.scheme = tg.colorScheme;
  tg.onEvent && tg.onEvent("themeChanged", () => { document.documentElement.dataset.scheme = tg.colorScheme; }); }
const initData = tg ? tg.initData : "";
const view = document.getElementById("view");
let timer = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = iso => { if (!iso) return ""; const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}); };
const LANG = {uz_latn: "uz", uz_cyrl: "уз", ru: "ru", en: "en"};
const WHO = {client: "Клиент", bot: "🤖 Бот", operator: "👨‍💼 Оператор"};
const KIND = {photo: "📷 Фото", voice: "🎤 Голос", audio: "🎵 Аудио", document: "📎 Файл"};

async function api(path, options = {}) {
  const res = await fetch(path, {...options, headers: {"Content-Type": "application/json",
    "X-Telegram-Init-Data": initData, ...(options.headers || {})}});
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || res.status), {status: res.status, body});
  return body;
}

function fail(e) {
  if (e.status === 401) view.innerHTML = '<div class="empty">Откройте панель через админ-бота в Telegram.</div>';
  else if (e.status === 403) view.innerHTML = `<div class="empty">Нет доступа. Добавьте ваш id <b>${esc(e.body.user_id)}</b> в ADMIN_IDS.</div>`;
  else view.innerHTML = `<div class="empty">Ошибка: ${esc(e.message)}</div>`;
}

function route() {
  clearInterval(timer);
  document.body.classList.remove("in-chat");
  const [name, arg] = (location.hash.slice(1) || "overview").split("=");
  const tab = {session: "sessions", client: "clients"}[name] || name;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const pages = {overview, sessions, session, operators, clients, client};
  (pages[name] || overview)(arg).catch(fail);
}
document.getElementById("tabs").onclick = e => { if (e.target.dataset.tab) location.hash = e.target.dataset.tab; };
window.addEventListener("hashchange", route);

async function overview() {
  const o = await api("/api/overview");
  const score = s => s.count ? `${s.average}★` : "—";
  const card = (v, label) => `<div class="card"><b>${esc(v)}</b><span>${label}</span></div>`;
  view.innerHTML = `<div class="cards">
    ${card(o.clients, `клиентов · +${o.clients_today} сегодня`)}
    ${card(o.sessions_open, "открытых сессий")}
    ${card(o.waiting_operator, "ждут оператора")}
    ${card(o.handoffs_today, "передано операторам сегодня")}
    ${card(o.sessions_today, "сессий сегодня")}
    ${card(o.messages_today, "сообщений сегодня")}
    ${card(score(o.rating_bot), `рейтинг бота · ${o.rating_bot.count} оценок`)}
    ${card(score(o.rating_operators), `рейтинг операторов · ${o.rating_operators.count}`)}
    ${card(o.operators_active, "активных операторов")}
  </div>
  <h2>Ждут оператора</h2><div id="waiting" class="list"></div>`;
  const open = (await api("/api/sessions?status=open&limit=50")).filter(s => s.escalated && !s.operator_id);
  document.getElementById("waiting").innerHTML = open.length ? open.map(sessionRow).join("")
    : '<div class="empty">Никто не ждёт</div>';
  timer = setInterval(() => overview().catch(fail), 15000);
}

function sessionRow(s) {
  const dot = s.status === "open" ? (s.escalated && !s.operator_id ? "wait" : "open") : "";
  const who = s.operator_name || (s.escalated ? "ждёт оператора" : "бот");
  const rating = s.rating ? ` · ${s.rating.stars}★` : "";
  return `<div class="row" onclick="location.hash='session=${s.id}'"><span class="dot ${dot}"></span>
    <div class="grow"><div class="title">${esc(s.client_name)}</div>
    <div class="muted">${esc(who)} · ${esc(s.topic || "—")}${rating}</div></div>
    <span class="muted">${when(s.opened_at)}</span></div>`;
}

async function sessions() {
  const q = new URLSearchParams(location.search);
  const ops = await api("/api/operators");
  const state = sessions.state || (sessions.state = {status: "", operator: q.get("operator") || ""});
  const load = async () => {
    const p = new URLSearchParams({limit: 200});
    if (state.status) p.set("status", state.status);
    if (state.operator) p.set("operator", state.operator);
    const list = await api("/api/sessions?" + p);
    document.getElementById("list").innerHTML = list.length ? list.map(sessionRow).join("")
      : '<div class="empty">Сессий нет</div>';
  };
  view.innerHTML = `<div class="filters">
    <select id="status"><option value="">Все</option><option value="open">Открытые</option><option value="closed">Завершённые</option></select>
    <select id="operator"><option value="">Все операторы</option>${ops.map(o =>
      `<option value="${esc(o.user_id)}">${esc(o.name)}</option>`).join("")}</select></div>
    <div id="list" class="list"><div class="empty">Загрузка…</div></div>`;
  const st = document.getElementById("status"), op = document.getElementById("operator");
  st.value = state.status; op.value = state.operator;
  st.onchange = () => { state.status = st.value; load().catch(fail); };
  op.onchange = () => { state.operator = op.value; load().catch(fail); };
  await load();
  timer = setInterval(() => load().catch(fail), 15000);
}

const AVATAR = ["#e17076", "#7bc862", "#e5ca77", "#65aadd", "#a695e7", "#ee7aae", "#6ec9cb", "#faa774"];
const initials = name => String(name || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const day = iso => { const d = new Date(iso); return isNaN(d) ? "" :
  d.toLocaleDateString("ru-RU", {day: "numeric", month: "long", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric"}); };
const clock = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"}); };
const media = new Map();  // /api/media/... -> Promise of a blob URL, so a refresh does not download again

function loadMedia(url) {
  if (!media.has(url)) media.set(url, fetch(url, {headers: {"X-Telegram-Init-Data": initData}})
    .then(r => r.ok ? r.blob() : Promise.reject(r.status)).then(b => ({url: URL.createObjectURL(b), type: b.type})));
  return media.get(url);
}

function fillMedia(root) {
  root.querySelectorAll(".ph[data-src]").forEach(el => {
    const src = el.dataset.src; el.removeAttribute("data-src");
    loadMedia(src).then(({url, type}) => {
      el.classList.remove("loading");
      if (type.startsWith("image/")) {
        const img = new Image(); img.src = url; img.alt = "Фото клиента";
        img.onclick = () => { const v = document.createElement("div"); v.className = "viewer";
          v.innerHTML = `<img src="${url}" alt="">`; v.onclick = () => v.remove(); document.body.append(v); };
        el.append(img);
      } else if (type.startsWith("audio/") || type.startsWith("video/ogg")) {
        el.innerHTML = `<audio controls preload="metadata" src="${url}"></audio>`;
      } else {
        el.classList.add("file"); el.innerHTML = `<a href="${url}" target="_blank" rel="noopener">📎 Открыть файл</a>`;
      }
    }, () => { el.classList.remove("loading"); el.textContent = el.dataset.fail || "Файл недоступен"; });
  });
}

function bubble(m, prev, next) {
  if (m.sender === "system" || m.sender === "event") return `<div class="service">${esc(m.text)}</div>`;
  const out = m.sender !== "client";
  const author = m.sender === "operator" ? "👨‍💼 " + (m.operator_name || "Оператор") : m.sender === "bot" ? "🤖 Бот" : "";
  const same = (a, b) => a && b && a.sender === b.sender && a.operator_name === b.operator_name
    && day(a.created_at) === day(b.created_at);
  const first = !same(prev, m), last = !same(m, next);
  const time = `<span class="time">${clock(m.created_at)}</span>`;
  const name = out && first ? `<div class="name">${esc(author)}</div>` : "";
  const cls = `bubble ${out ? "out" : "in"}${last ? " last" : ""}`;
  const placeholder = /^\[.*\]$/.test(m.text || "");  // "[фото]" saved instead of a caption
  const caption = placeholder ? "" : esc(m.text);
  if (m.files && m.id) {
    const audio = m.kind === "voice" || m.kind === "audio";
    const fail = audio ? "🎤 Голосовое недоступно" : "📷 Фото недоступно";
    const items = Array.from({length: m.files}, (_, i) =>
      `<div class="ph loading" data-src="/api/media/${m.id}/${i}" data-fail="${fail}"></div>`).join("");
    return `<div class="${cls} media${audio ? " audio" : ""}">${name}<div class="photos n${Math.min(m.files, 4)}">${items}</div>${
      caption ? `<div class="caption">${caption}${time}</div>` : time.replace('class="time"', 'class="time over"')}</div>`;
  }
  const kind = m.kind !== "text" ? `<span class="kind">${KIND[m.kind] || m.kind}</span>${caption ? "\n" : ""}` : "";
  return `<div class="${cls}">${name}${kind}${caption}${time}</div>`;
}

async function session(id) {
  document.body.classList.add("in-chat");
  let shown = "";
  const render = async () => {
    const s = await api(`/api/sessions/${encodeURIComponent(id)}`);
    const sig = s.status + s.messages.length + ":" + (s.messages.at(-1) || {}).id;
    if (sig === shown) return s;  // nothing new: keep loaded photos and the scroll position
    const firstRender = !shown;
    shown = sig;
    const rows = [];
    s.messages.forEach((m, i) => {
      if (day(m.created_at) !== day((s.messages[i - 1] || {}).created_at)) rows.push(`<div class="day">${day(m.created_at)}</div>`);
      rows.push(bubble(m, s.messages[i - 1], s.messages[i + 1]));
    });
    const who = s.operator_name || (s.escalated ? "ждёт оператора" : "бот");
    const live = s.status === "open";
    const stillAtBottom = innerHeight + scrollY >= document.body.scrollHeight - 80;
    view.innerHTML = `<div class="tgchat">
      <div class="tgbar"><button class="back" onclick="history.back()" aria-label="Назад">‹</button>
        <div class="avatar" style="background:${AVATAR[Math.abs(parseInt(s.client_id, 10) || 0) % AVATAR.length]}">${esc(initials(s.client_name))}</div>
        <div class="who" onclick="location.hash='client=${esc(s.client_id)}'" title="Все сессии клиента">
          <b>${esc(s.client_name)}</b>
          <span class="${live ? "live" : ""}">${live ? "открыта" : "завершена"} · ${esc(who)} · ${esc(s.topic || "без темы")} · ${esc(LANG[s.language] || s.language || "")}${s.rating ? ` · ${s.rating.stars}★` : ""}</span>
          <span>${[s.client_username ? "@" + s.client_username : "", s.client_phone || "", "сессия #" + s.id].filter(Boolean).map(esc).join(" · ")}</span>
        </div></div>
      <div class="tgmsgs">${rows.join("") || '<div class="service">Сообщений нет</div>'}</div></div>`;
    fillMedia(view);
    if (firstRender || stillAtBottom) scrollTo(0, document.body.scrollHeight);
    return s;
  };
  const s = await render();
  if (s.status === "open") timer = setInterval(() => render().catch(fail), 5000);
}

async function operators() {
  const ops = await api("/api/operators");
  view.innerHTML = `<form class="add" id="add"><b>Добавить оператора</b>
      <input name="phone" inputmode="tel" placeholder="Телефон: +998 90 123 45 67 (или Telegram id)" required>
      <input name="name" placeholder="Имя">
      <button class="btn">Добавить</button></form>
    <p class="muted">Оператор открывает клиентский бот, нажимает /start и при регистрации делится этим номером:
      бот сам привяжет его Telegram id. Пока нет ни одного привязанного оператора, клиентам отвечает любой
      участник чата поддержки; потом — только активные операторы из списка.</p>
    <div class="list">${ops.map(o => `<div class="row"><span class="dot ${o.active ? "open" : ""}"></span>
      <div class="grow" onclick="location.hash='sessions'; sessions.state={status:'', operator:'${esc(o.user_id || "")}'}">
        <div class="title">${esc(o.name)} ${o.username ? "@" + esc(o.username) : ""}</div>
        <div class="muted">${o.registered && !o.linked ? '<span class="pill">ждём регистрации в боте</span> ' : ""}${[o.phone, o.user_id ? "id " + o.user_id : ""].filter(Boolean).map(esc).join(" · ")} · ответов ${o.replies} · сессий ${o.sessions} (открыто ${o.sessions_open})
          · ${o.rating !== null ? o.rating + "★ (" + o.ratings + ")" : "оценок нет"}
          ${o.last_reply ? " · последний ответ " + when(o.last_reply) : ""}</div></div>
      <button class="btn ghost" data-id="${esc(o.key)}" data-name="${esc(o.name)}"
        data-act="${o.registered ? (o.active ? "off" : "on") : "add"}">${o.registered ? (o.active ? "Отключить" : "Включить") : "Добавить"}</button>
    </div>`).join("") || '<div class="empty">Операторов пока нет</div>'}</div>`;
  document.getElementById("add").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    await api("/api/operators", {method: "POST", body: JSON.stringify(Object.fromEntries(f))}).catch(err =>
      alert({bad_id: "Telegram id — это число", bad_phone: "Проверьте номер телефона"}[err.message] || err.message));
    operators().catch(fail);
  };
  view.querySelectorAll("button[data-act]").forEach(b => b.onclick = async () => {
    const id = b.dataset.id;
    if (b.dataset.act === "add") await api("/api/operators", {method: "POST", body: JSON.stringify({user_id: id, name: b.dataset.name})});
    else await api(`/api/operators/${encodeURIComponent(id)}/active`, {method: "POST", body: JSON.stringify({active: b.dataset.act === "on"})});
    operators().catch(fail);
  });
}

async function clients() {
  view.innerHTML = `<input id="q" placeholder="Поиск: имя, @username, телефон, id">
    <div id="list" class="list"><div class="empty">Загрузка…</div></div>`;
  const q = document.getElementById("q");
  const load = async () => {
    const list = await api("/api/clients?" + new URLSearchParams({q: q.value, limit: 200}));
    document.getElementById("list").innerHTML = list.map(c => `<div class="row" onclick="location.hash='client=${esc(c.chat_id)}'">
      <div class="grow"><div class="title">${esc(c.full_name || c.username || c.chat_id)}
        ${c.username ? '<span class="muted">@' + esc(c.username) + "</span>" : ""}</div>
      <div class="muted">${c.phone ? esc(c.phone) + " · " : ""}${esc(LANG[c.language] || "язык не выбран")} ·
        сессий ${c.sessions} · ${esc(c.level)}</div></div>
      <span class="muted">${when(c.last_message || c.created_at)}</span></div>`).join("") || '<div class="empty">Нет клиентов</div>';
  };
  let t; q.oninput = () => { clearTimeout(t); t = setTimeout(() => load().catch(fail), 300); };
  await load();
}

async function client(id) {
  const list = await api("/api/sessions?" + new URLSearchParams({client: id, limit: 200}));
  view.innerHTML = `<button class="back" onclick="history.back()">‹ Назад</button>
    <h2>${esc(list[0] ? list[0].client_name : id)}</h2>
    <div class="list">${list.map(sessionRow).join("") || '<div class="empty">Сессий нет</div>'}</div>`;
}

if (tg && tg.BackButton) {
  tg.BackButton.onClick(() => history.back());
  window.addEventListener("hashchange", () => /^#(session|client)=/.test(location.hash)
    ? tg.BackButton.show() : tg.BackButton.hide());
}
route();
</script>
