name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose build
      - name: container starts and exits cleanly without a token
        run: |
          docker compose run --rm -T bot > out.txt 2>&1 || true
          cat out.txt
          grep -q "TELEGRAM_BOT_TOKEN is not set" out.txt
